repos:

- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
    - id: python-use-type-annotations

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: debug-statements

- repo: https://github.com/jendrikseipp/vulture
  rev: v2.16
  hooks:
    - id: vulture
      # Analyse the whole tree (paths from pyproject.toml, incl. the whitelist)
      # rather than only changed files, since vulture is a whole-program analyser.
      pass_filenames: false

- repo: https://github.com/saattrupdan/funcsort
  rev: v0.1.1
  hooks:
    - id: funcsort
      args:
        - --fix

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.0
  hooks:
    - id: ruff
      args:
        - --fix
        - --unsafe-fixes
        - --exit-non-zero-on-fix
        - --no-cache
      types_or:
        - python
        - pyi
        - jupyter
    - id: ruff-format
      args:
        - --no-cache
      types_or:
        - python
        - pyi
        - jupyter

- repo: https://github.com/kynan/nbstripout
  rev: 0.9.1
  hooks:
  -   id: nbstripout

- repo: local
  hooks:
  -   id: ty-check
      name: ty (type checking)
      entry: uv run ty check
      language: system
      pass_filenames: false
      types: [python]

- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.23.1
  hooks:
  -   id: markdownlint-cli2
      args:
        - --fix

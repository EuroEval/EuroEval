name: Volunteer worker image

on:
  pull_request:
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build amd64 worker image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker's local image exporter cannot load multi-platform attestations.
          # Trusted publications retain both attestations; PR builds load for smoke tests.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=euroeval-worker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-${{ github.ref_name }}

      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm "$IMAGE" --version

      - name: Make published package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package=/orgs/${{ github.repository_owner }}/packages/container/euroeval-worker
          if ! gh api --method PATCH "$package" -f visibility=public; then
            echo "::warning::The workflow token could not set GHCR visibility. Package admin permission may need to be granted once."
          fi
          visibility="$(gh api "$package" --jq .visibility 2>/dev/null || true)"
          if [ "$visibility" != public ]; then
            echo "::warning::GHCR reports visibility '${visibility:-unknown}'; the anonymous-pull check will fail unless an administrator makes the package public."
          fi

      - name: Verify anonymous digest pull
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker@${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io || true
          rm -f "${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if ! docker pull "$IMAGE"; then
            echo "::error::Anonymous pull of $IMAGE failed. Make the GHCR package public or grant this workflow package-admin permission."
            exit 1
          fi
          echo "$IMAGE"

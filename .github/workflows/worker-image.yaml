name: Volunteer worker image

on:
  pull_request:
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build amd64 worker image
    runs-on: ubuntu-24.04
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/euroeval-worker-docker
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker's local image exporter cannot load multi-platform attestations.
          # Trusted publications retain both attestations; PR builds load for smoke tests.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=euroeval-worker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-${{ github.ref_name }}

      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm "$IMAGE" --version

      - name: Verify published package is public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=/orgs/${{ github.repository_owner }}/packages/container/euroeval-worker
          visibility="$(gh api "$package" --jq .visibility 2>/dev/null || true)"
          if [ "$visibility" != public ]; then
            echo "::error::GHCR reports visibility '${visibility:-unknown}'. Make the package public in GitHub Packages settings, then rerun this workflow."
            exit 1
          fi

      - name: Verify candidate manifest anonymously
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          rm -rf "$DOCKER_CONFIG"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          if [ -z "$DIGEST" ]; then
            echo "::error::Build did not return a candidate digest."
            exit 1
          fi
          REFERENCE="$IMAGE@$DIGEST"
          manifest="$(docker buildx imagetools inspect "$REFERENCE" --format '{{json .}}')"
          printf '%s\n' "$manifest" | jq -e --arg digest "$DIGEST" '
            ((.digest // .Digest // .descriptor.digest // .Descriptor.digest) == $digest)
            and any((.manifests // .Manifests // [])[]?;
              (.platform.os == "linux" and .platform.architecture == "amd64")
              and ((.digest // .Digest // .descriptor.digest // .Descriptor.digest) != null)
            )
          ' >/dev/null || {
            echo "::error::Candidate manifest does not prove the index digest and linux/amd64 child."
            exit 1
          }
          echo "Verified immutable manifest: $REFERENCE"

      - name: Publish candidate metadata
        if: github.event_name != 'pull_request'
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/euroeval/euroeval-worker
          PLATFORM: linux/amd64
          SHA_TAG: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '{"commit":"%s","image":"%s","platform":"%s","sha_tag":"%s","digest":"%s"}\n' \
            "$COMMIT" "$IMAGE" "$PLATFORM" "$SHA_TAG" "$DIGEST" > worker-image-metadata.json
          {
            echo "## Volunteer worker candidate"
            echo "- Commit: \\`$COMMIT\\`"
            echo "- Image: \\`$IMAGE\\`"
            echo "- Platform: \\`$PLATFORM\\`"
            echo "- SHA tag: \\`$SHA_TAG\\`"
            echo "- Digest: \\`$DIGEST\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: volunteer-worker-image-metadata
          path: worker-image-metadata.json
          if-no-files-found: error

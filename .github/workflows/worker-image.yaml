name: Volunteer worker image

on:
  pull_request:
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build amd64 worker image
    runs-on: ubuntu-24.04

    steps:
      - name: Prepare isolated Docker config
        run: |
          set -euo pipefail
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/euroeval-worker-docker"
          mkdir -m 700 -p "$DOCKER_CONFIG_DIR"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker's local image exporter cannot load multi-platform attestations.
          # Trusted publications retain both attestations; PR builds load for smoke tests.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=euroeval-worker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-${{ github.ref_name }}

      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm "$IMAGE" --version

      - name: Verify published package is public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=/orgs/${{ github.repository_owner }}/packages/container/euroeval-worker
          visibility="$(gh api "$package" --jq .visibility 2>/dev/null || true)"
          if [ "$visibility" != public ]; then
            echo "::error::GHCR reports visibility '${visibility:-unknown}'. Make the package public in GitHub Packages settings, then rerun this workflow."
            exit 1
          fi

      - name: Verify candidate manifest anonymously
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          SHA_TAG: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PREVIOUS_DOCKER_CONFIG="${DOCKER_CONFIG:-}"
          ANONYMOUS_DOCKER_CONFIG="$RUNNER_TEMP/euroeval-worker-anonymous-docker"
          rm -rf "$ANONYMOUS_DOCKER_CONFIG"
          mkdir -m 700 -p "$ANONYMOUS_DOCKER_CONFIG"
          export DOCKER_CONFIG="$ANONYMOUS_DOCKER_CONFIG"
          unset BUILDX_BUILDER DOCKER_AUTH_CONFIG
          cleanup() {
            rm -rf "$ANONYMOUS_DOCKER_CONFIG"
            if [ -n "$PREVIOUS_DOCKER_CONFIG" ]; then
              rm -rf "$PREVIOUS_DOCKER_CONFIG"
            fi
          }
          trap cleanup EXIT
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Build did not return a valid candidate digest."
            exit 1
          fi
          if [ -z "$SHA_TAG" ]; then
            echo "::error::Build did not return a candidate SHA tag."
            exit 1
          fi
          REFERENCE="$IMAGE@$DIGEST"
          digest_manifest="$(docker manifest inspect "$REFERENCE")"
          tag_manifest="$(docker manifest inspect "$SHA_TAG")"
          digest_manifest_canonical="$(printf '%s\n' "$digest_manifest" | jq -S -c .)"
          tag_manifest_canonical="$(printf '%s\n' "$tag_manifest" | jq -S -c .)"
          if [ "$digest_manifest_canonical" != "$tag_manifest_canonical" ]; then
            echo "::error::Candidate SHA tag does not match its digest reference."
            exit 1
          fi
          printf '%s\n' "$digest_manifest" | jq -e '
            any((.manifests // [])[]?;
              (.platform.os == "linux" and .platform.architecture == "amd64")
              and (.digest != null)
              and (.digest | type == "string")
            )
          ' >/dev/null || {
            echo "::error::Candidate manifest does not contain a linux/amd64 child digest."
            exit 1
          }
          echo "Verified immutable manifest anonymously."

      - name: Publish candidate metadata
        if: success() && github.event_name != 'pull_request'
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/euroeval/euroeval-worker
          PLATFORM: linux/amd64
          SHA_TAG: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '{"commit":"%s","image":"%s","platform":"%s","sha_tag":"%s","digest":"%s"}\n' \
            "$COMMIT" "$IMAGE" "$PLATFORM" "$SHA_TAG" "$DIGEST" > worker-image-metadata.json
          {
            echo "## Volunteer worker candidate"
            printf -- '- Commit: `%s`\n' "$COMMIT"
            printf -- '- Image: `%s`\n' "$IMAGE"
            printf -- '- Platform: `%s`\n' "$PLATFORM"
            printf -- '- SHA tag: `%s`\n' "$SHA_TAG"
            printf -- '- Digest: `%s`\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate metadata
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: volunteer-worker-image-metadata
          path: worker-image-metadata.json
          if-no-files-found: error

name: Volunteer worker image

on:
  pull_request:
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  push:
    branches: [main]
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: volunteer-worker-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    name: Build amd64 worker image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: type=sha,format=long,prefix=sha-
      - name: Build worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=euroeval-worker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-${{ github.ref_name }}
      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm --entrypoint nvcc "$IMAGE" --version
          docker run --rm "$IMAGE" --version

  arm64:
    name: Build arm64 worker image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: type=sha,format=long,prefix=spark-arm64-sha-
      - name: Build worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=euroeval-worker-spark-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-spark-${{ github.ref_name }}
      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm --entrypoint nvcc "$IMAGE" --version
          docker run --rm "$IMAGE" --version

  publish:
    name: Publish multi-architecture image
    needs: [image, arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined image
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          SOURCE_SHA: ${{ github.sha }}
          AMD64_DIGEST: ${{ needs.image.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="$IMAGE:multiarch-sha-$SOURCE_SHA"
          docker buildx imagetools create --tag "$TAG" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools inspect "$TAG" >> "$GITHUB_STEP_SUMMARY"

name: Volunteer worker image

on:
  pull_request:
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/worker-image.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/euroeval/**"
      - "src/euroeval_worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Avoid overlapping publications. A separate HEAD check below rejects stale reruns,
# because GitHub does not guarantee FIFO ordering within a concurrency group.
concurrency:
  group: volunteer-worker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build amd64 worker image
    runs-on: ubuntu-24.04
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/euroeval-worker-docker
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/euroeval/euroeval-worker
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker's local image exporter cannot load multi-platform attestations.
          # Trusted publications retain both attestations; PR builds load for smoke tests.
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=euroeval-worker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=euroeval-worker-${{ github.ref_name }}

      - name: Smoke entrypoint and non-root runtime
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "worker"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm "$IMAGE" --version

      - name: Verify published package is public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=/orgs/${{ github.repository_owner }}/packages/container/euroeval-worker
          visibility="$(gh api "$package" --jq .visibility 2>/dev/null || true)"
          if [ "$visibility" != public ]; then
            echo "::error::GHCR reports visibility '${visibility:-unknown}'. Make the package public once in GitHub Packages settings, then rerun this workflow."
            exit 1
          fi

      - name: Verify candidate with an anonymous digest pull
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
          mkdir -p "$DOCKER_CONFIG"
          if [ -z "$DIGEST" ] || ! docker pull "$IMAGE@$DIGEST"; then
            echo "::error::Anonymous pull of the exact candidate digest failed. Confirm that the GHCR package is public, then rerun this workflow."
            exit 1
          fi

      - name: Reauthenticate for latest promotion
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject stale default-branch publications
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/${{ github.event.repository.default_branch }}" --jq .object.sha)"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to promote stale commit $GITHUB_SHA; the default branch is now at $current_sha."
            exit 1
          fi

      - name: Promote verified candidate to latest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Remove promotion credentials
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

      - name: Verify latest anonymously matches the candidate
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ghcr.io/euroeval/euroeval-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          if ! docker pull "$IMAGE:latest"; then
            echo "::error::Anonymous pull of latest failed after promotion."
            exit 1
          fi
          repo_digests="$(docker image inspect "$IMAGE:latest" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          if ! printf '%s\n' "$repo_digests" | grep -Fxq "$IMAGE@$DIGEST"; then
            echo "::error::latest does not resolve to the verified candidate digest."
            printf 'Observed RepoDigests:\n%s\n' "$repo_digests"
            exit 1
          fi

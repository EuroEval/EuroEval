name: Volunteer worker release

on:
  workflow_run:
    workflows: [CI, Volunteer worker image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [stage, finalize]
        default: stage
      release_tag:
        type: string
      deployment:
        type: string

permissions:
  contents: read

# Serialize stage/finalize, including completions arriving in either order.
concurrency:
  group: volunteer-worker-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.WORKER_RELEASE_ENABLED == 'true' &&
      github.repository == 'EuroEval/EuroEval' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'EuroEval/EuroEval' &&
      github.event.workflow_run.conclusion == 'success')
    environment: volunteer-worker-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: oras-project/setup-oras@v1
      - name: Authenticate GHCR using stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Stage accepted current-main release
        if: github.event_name == 'workflow_run' || inputs.phase == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RELEASE_ENABLED: ${{ vars.WORKER_RELEASE_ENABLED }}
          WORKER_RELEASE_ACCEPTANCE_JSON: ${{ vars.WORKER_RELEASE_ACCEPTANCE_JSON }}
          WORKER_RELEASE_BASELINE_JSON: ${{ vars.WORKER_RELEASE_BASELINE_JSON }}
        run: uv run python src/scripts/release_volunteer_worker.py stage
      - name: Finalize independently verified production
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'finalize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WORKER_RELEASE_ENABLED: ${{ vars.WORKER_RELEASE_ENABLED }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: >-
          uv run python src/scripts/release_volunteer_worker.py finalize
          --release-tag "$RELEASE_TAG" --deployment "$DEPLOYMENT"
